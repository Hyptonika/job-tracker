<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
        .card {
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.10);
        }
    </style>

    
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex justify-content-between align-items-center flex-nowrap">

            <a class="navbar-brand mb-0" href="/">Job Tracker</a>

            <div class="d-flex flex-nowrap">

                {% if session.get("user_id") %}

                    <a class="nav-link px-2" href="/">Home</a>
                    <a class="nav-link px-2" href="/add">Add Job</a>
                    <a class="nav-link px-2" href="/logout">Logout</a>

                {% else %}

                    <a class="nav-link px-2" href="/login">Login</a>
                    <a class="nav-link px-2" href="/register">Register</a>

                {% endif %}

            </div>

        </div>
    </nav>

    <main class="container mt-4">
        {% block main %}{% endblock %}
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
